<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>水厂中控台</title>
<style>
body { font-family: "Microsoft YaHei", sans-serif; margin: 24px; background: #f4f6f8; }
section { background: #fff; border: 1px solid #d8dee4; border-radius: 6px; padding: 16px; margin-bottom: 16px; }
h1 { font-size: 20px; }
table { border-collapse: collapse; width: 100%; }
td, th { border: 1px solid #d8dee4; padding: 6px 10px; text-align: left; }
.bad { color: #b42318; font-weight: 600; }
.ok { color: #087443; font-weight: 600; }
</style>
</head>
<body>
<h1>自来水厂加氯加药与滤池控制系统</h1>
<section id="summary"><p>正在加载中控数据…</p></section>
<script>
async function refresh() {
  try {
    const res = await fetch("/api/console/summary");
    const data = await res.json();
    let html = "<table><tr><th>项目</th><th>内容</th></tr>";
    html += "<tr><td>投加状态</td><td>" + (data.Dosing ? data.Dosing.State : "-") + "</td></tr>";
    html += "<tr><td>投加次数</td><td>" + (data.Dosing ? data.Dosing.Executed : 0) + "</td></tr>";
    html += "<tr><td>记录数</td><td>" + data.RecordsWritten + "</td></tr>";
    html += "<tr><td>记录句柄</td><td>" + data.RecordHandles + "</td></tr>";
    html += "</table><h3>滤池状态</h3><table><tr><th>滤池</th><th>状态</th><th>就地</th><th>反冲次数</th></tr>";
    for (const id in data.Filters) {
      const f = data.Filters[id];
      const cls = f.State === "filtering" ? "ok" : "bad";
      html += "<tr><td>" + id + "</td><td class=\"" + cls + "\">" + f.State + "</td><td>" + f.Local + "</td><td>" + f.Backwashes + "</td></tr>";
    }
    html += "</table><h3>水质</h3><table><tr><th>点位</th><th>浊度</th><th>余氯</th></tr>";
    for (const id in data.Quality) {
      const q = data.Quality[id];
      html += "<tr><td>" + id + "</td><td>" + q.Turbidity.toFixed(2) + "</td><td>" + q.Chlorine.toFixed(2) + "</td></tr>";
    }
    html += "</table>";
    document.getElementById("summary").innerHTML = html;
  } catch (err) {
    document.getElementById("summary").textContent = "加载失败：" + err;
  }
}
refresh();
setInterval(refresh, 2000);
if (typeof EventSource !== "undefined") {
  const source = new EventSource("/ws/console");
  source.onmessage = function () { refresh(); };
}
</script>
</body>
</html>
